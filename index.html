<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تمرينتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0A0A0A;--cd:#161616;--ink:#F5F5F5;--mut:#9A9A9A;--yl:#FFD400;--rd:#E10600;--ln:#2A2A2A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:28px;font-weight:900;margin:4px 0}
h2{font-size:18px;font-weight:900;margin:20px 0 8px;border-inline-start:5px solid var(--yl);padding-inline-start:10px}
p{margin:0}
.mut{color:var(--mut);font-size:14px}
.hero{border-radius:14px;padding:18px 16px;margin-bottom:6px;background:linear-gradient(115deg,var(--rd) 0 9%,var(--yl) 9% 12%,var(--cd) 12%);border:1px solid var(--ln)}
.hero h1{font-size:34px;font-style:italic}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0}
.tap{cursor:pointer;border-inline-start:4px solid var(--rd)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1}
.th{width:92px;height:58px;border-radius:8px;background:#0d0d0d;border:1px solid var(--ln);flex:none}
.pic{display:block;width:100%;height:100%}
.big{width:100%;height:auto;aspect-ratio:5/3;background:#0d0d0d;border:1px solid var(--ln);border-radius:12px}
.pic polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pic .ol{stroke:#000;stroke-width:15}
.pic .bd{stroke:var(--rd);stroke-width:11}
.pic .ar{stroke:#E8B48A;stroke-width:9}
.pic .hd{fill:#E8B48A;stroke:#000;stroke-width:2}
.pic .hb{fill:none;stroke:var(--yl);stroke-width:4;stroke-linecap:round}
.pic .ey{fill:#000;stroke:none}
.pic .pr{fill:none;stroke:#666;stroke-width:4;stroke-linecap:round}
img.pic{object-fit:contain}
.f1{animation:k1 1.8s infinite}.f2{animation:k2 1.8s infinite}
@keyframes k1{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes k2{0%,49.9%{opacity:0}50%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.f1,.f2{animation:none}.f2{opacity:0}}
.btn{background:var(--yl);color:#000;border:0;border-bottom:4px solid var(--rd);border-radius:10px;padding:12px 16px;font:900 17px Cairo,system-ui,sans-serif;width:100%;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--cd);color:var(--yl);border:1px solid var(--yl);border-bottom-width:1px}
.back{background:none;border:0;color:var(--yl);font:700 15px Cairo,system-ui,sans-serif;padding:6px 0;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:8px;padding:6px 14px;font:700 14px Cairo,system-ui,sans-serif;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--yl);color:#000;border-color:var(--yl)}
.sets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.set{width:50px;height:50px;border-radius:10px;border:2px solid var(--ln);background:#0d0d0d;color:var(--ink);font:900 18px Cairo,system-ui,sans-serif;cursor:pointer}
.set.done{background:var(--yl);border-color:var(--yl);color:#000}
.tag{display:inline-block;background:#2a0b09;color:#ff6a5e;border-radius:6px;padding:2px 9px;font-size:13px;font-weight:700}
ol{padding-inline-start:20px;margin:8px 0;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;text-align:center;border-top:3px solid var(--rd)}
.stat b{display:block;font-size:30px;font-weight:900;color:var(--yl)}
.body{width:100%;display:block;background:var(--cd);border:1px solid var(--ln);border-radius:12px}
.sil{fill:#262626}
.mu{fill:rgba(225,6,0,.6);stroke:var(--rd);stroke-width:1.5;cursor:pointer}
.mu.on{fill:var(--yl);stroke:var(--yl)}
.bl{fill:var(--mut);font:700 14px Cairo,system-ui,sans-serif;text-anchor:middle}
nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:3px solid var(--rd);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:700 12px Cairo,system-ui,sans-serif;padding:6px 0;cursor:pointer}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--yl)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--yl);color:#000;border-radius:12px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;font-weight:900;max-width:536px;margin:0 auto;border-bottom:4px solid var(--rd)}
#rest button{background:#000;color:var(--yl);border:0;border-radius:8px;padding:6px 14px;font:700 14px Cairo,system-ui,sans-serif;cursor:pointer}
</style>

['مهارات وتحمل',[['hp',4,'4'],['dp',4,'10'],['hs',4,'30ث'],['pt',3,'60ث']]]]}
};
var tab='prog',v={},pv=null,ses=null,tmr=null,left=0,gf='all';
function H(){try{return JSON.parse(localStorage.getItem('tt_h')||'[]')}catch(e){return[]}}
function S(h){try{localStorage.setItem('tt_h',JSON.stringify(h))}catch(e){}}
function $(s){return document.querySelector(s)}
function go(t){tab=t;v={};render()}
function openE(k){pv={t:tab,v:v};v={e:k};render()}
function backE(){tab=pv.t;v=pv.v;render()}
function render(){
 var h='';
 if(v.e)h=vEx();
 else if(tab==='prog')h=v.ses?vSes():v.p?vProg():vHome();
 else if(tab==='mus')h=vMus();
 else if(tab==='ex')h=vExs();
 else h=vStats();
 $('#app').innerHTML=h;window.scrollTo(0,0);
 var it=[['prog','🏠','برامجي'],['mus','🦾','العضلات'],['ex','📚','التمارين'],['st','📈','تقدمي']];
 $('#nav').innerHTML=it.map(function(i){return '<button class="'+(tab===i[0]?'on':'')+'" onclick="go(\''+i[0]+'\')"><span>'+i[1]+'</span>'+i[2]+'</button>'}).join('');
}
function exCard(k){var e=EX[k];return '<div class="card tap row" onclick="openE(\''+k+'\')"><div class="th">'+pic(k)+'</div><div class="grow"><b>'+e[0]+'</b><p class="mut">'+e[2]+'</p></div></div>'}
function vHome(){
 var wk=H().filter(function(x){return Date.now()-new Date(x.d)<6048e5}).length;
 var h='<div class="hero"><h1>تمرينتي</h1><p class="mut">وزن جسمك هو الجيم. تمارين الأسبوع ده: <b style="color:var(--yl)">'+wk+'</b></p></div><h2>البرامج</h2>';
 for(var k in PR){var p=PR[k];h+='<div class="card tap row" onclick="v={p:\''+k+'\'};render()"><div style="font-size:30px">'+p.ic+'</div><div class="grow"><b>'+p.n+'</b><p class="mut">'+p.d+'</p></div></div>'}
 return h+'<h2>قواعد سريعة</h2><div class="card mut" style="line-height:1.9">• إحماء 5 دقائق قبل كل تمرين.<br>• راحة 60-90 ثانية بين المجموعات.<br>• لما تحقق أعلى رقم في كل المجموعات، انتقل للتمرين الأصعب.<br>• لو في ألم حاد، وقف واستشر مختص.</div>';
}
function vProg(){
 var p=PR[v.p],h='<button class="back" onclick="v={};render()">← رجوع</button><h1>'+p.ic+' '+p.n+'</h1><p class="mut">'+p.d+'</p>';
 p.days.forEach(function(d,i){
  h+='<div class="card"><b>'+d[0]+'</b><div style="margin:8px 0">'+d[1].map(function(x){return '<span class="tag" style="margin:2px;display:inline-block">'+EX[x[0]][0]+' '+x[1]+'×'+x[2]+'</span>'}).join('')+'</div><button class="btn" onclick="start(\''+v.p+'\','+i+')">ابدأ التمرين</button></div>';
 });
 return h;
}
function start(p,i){
 var d=PR[p].days[i];ses={p:p,name:PR[p].n+' - '+d[0],ex:d[1].map(function(x){var a=[];for(var j=0;j<x[1];j++)a.push(0);return {id:x[0],t:x[2],s:a}})};
 v={ses:1};render();
}
function vSes(){
 var h='<button class="back" onclick="if(confirm(\'تخرج من التمرين؟\')){stopRest();ses=null;v={p:\''+ses.p+'\'};render()}">← خروج</button><h1>'+ses.name+'</h1><p class="mut">المدرب: ابدأ بإحماء 5 دقايق. علّم على كل مجموعة بعد ما تخلصها وهتبدأ الراحة تلقائي (الأصعب = راحة أطول). في تمارين الثبات المؤقت بيعدّ عنك.</p>';
 ses.ex.forEach(function(x,k){
  var e=EX[x.id];
  h+='<div class="card"><div class="row"><div class="th" onclick="openE(\''+x.id+'\')">'+pic(x.id)+'</div><div class="grow"><b>'+e[0]+'</b><p class="mut">الهدف: '+x.s.length+' × '+x.t+' · راحة '+(RS[x.id]||75)+'ث</p></div><button class="chip" onclick="openE(\''+x.id+'\')">شرح</button></div><div class="sets">'+x.s.map(function(d,j){return '<button class="set'+(d?' done':'')+'" onclick="tog('+k+','+j+')">'+(d?'✓':(j+1))+'</button>'}).join('')+'</div></div>';
 });
 return h+'<button class="btn" onclick="fin()">إنهاء وحفظ التمرين</button>';
}
var RS={hp:120,pl:120,ch:105,dp:105,hs:120,tl:75,pk:90,dpu:90,pu:75,ipu:60,ar:75,bd:75,sq:60,ss:75,gb:45,cr:40,pt:45,hc:45,lr:45,sm:40},LB='',AC=null;
function wake(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(function(){})}catch(e){}}
function beep(l){try{var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=l?880:620;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(l?.6:.12))}catch(e){}}
function run(lb,sec,next){
 clearInterval(tmr);LB=lb;left=sec;$('#rest').style.display='flex';upd();
 tmr=setInterval(function(){left--;if(left<=0){clearInterval(tmr);beep(1);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}if(next)next();else stopRest()}else{if(left<=3)beep(0);upd()}},1000);
}
function draw(){var y=window.scrollY;render();window.scrollTo(0,y)}
function tog(k,j){
 var x=ses.ex[k],e=EX[x.id];wake();
 if(x.s[j]){x.s[j]=0;stopRest();draw();return}
 var hold=e[4]==='h',sec=parseInt(x.t)||30;
 function fin1(){
  x.s[j]=1;draw();
  var last=x.s.every(Boolean),nx=ses.ex[k+1];
  if(last&&!nx){stopRest();return}
  run(last?'راحة قبل «'+EX[nx.id][0]+'»':'راحة',(RS[x.id]||75)+(last?30:0));
 }
 if(hold)run('استعد…',3,function(){run('اثبت 💪',sec,fin1)});else fin1();
}
function upd(){$('#rt').textContent=LB+' · '+Math.floor(left/60)+':'+('0'+left%60).slice(-2)}
function stopRest(){clearInterval(tmr);$('#rest').style.display='none'}
// خريطة العضلات
function E(x,y,a,b){return 'cx="'+x+'" cy="'+y+'" rx="'+a+'" ry="'+b+'"'}
var FR=[['sh',E(52,82,13,14)],['sh',E(148,82,13,14)],['ch',E(82,108,20,16)],['ch',E(118,108,20,16)],['bi',E(45,124,9,20)],['bi',E(155,124,9,20)],['ab','x="84" y="130" width="32" height="60" rx="10"'],['qd',E(81,255,16,46)],['qd',E(119,255,16,46)]];
var BK=[['tp','d="M100 60L72 82H128Z"'],['sh',E(52,82,13,14)],['sh',E(148,82,13,14)],['lt',E(80,120,17,30)],['lt',E(120,120,17,30)],['tr',E(45,124,9,20)],['tr',E(155,124,9,20)],['lb','x="84" y="152" width="32" height="40" rx="10"'],['gl',E(83,214,18,17)],['gl',E(117,214,18,17)],['hm',E(81,274,15,34)],['hm',E(119,274,15,34)],['cf',E(81,347,12,28)],['cf',E(119,347,12,28)]];
function fig(L,ox,lab){
 var o='<g transform="translate('+ox+',0)"><circle class="sil" cx="100" cy="30" r="18"/><rect class="sil" x="92" y="44" width="16" height="16"/><rect class="sil" x="62" y="58" width="76" height="140" rx="26"/><rect class="sil" x="34" y="70" width="22" height="130" rx="11"/><rect class="sil" x="144" y="70" width="22" height="130" rx="11"/><rect class="sil" x="64" y="195" width="34" height="195" rx="16"/><rect class="sil" x="102" y="195" width="34" height="195" rx="16"/>';
 L.forEach(function(m){var t=m[1].charAt(0)==='c'?'ellipse':m[1].charAt(0)==='d'?'path':'rect';o+='<'+t+' '+m[1]+' class="mu'+(v.m===m[0]?' on':'')+'" onclick="pickM(\''+m[0]+'\')"/>'});
 return o+'<text class="bl" x="100" y="396">'+lab+'</text></g>';
}
function pickM(m){v.m=m;var y=window.scrollY;render();window.scrollTo(0,y)}
function vMus(){
 var h='<h1>خريطة العضلات</h1><p class="mut">اضغط على العضلة اللي عايز تمرنها.</p><div style="height:8px"></div><svg viewBox="0 0 420 405" class="body" role="img" aria-label="جسم الإنسان">'+fig(FR,0,'أمام')+fig(BK,220,'خلف')+'</svg>';
 if(!v.m)return h+'<div class="card mut">لسه مااخترتش عضلة.</div>';
 h+='<h2>'+MN[v.m]+'</h2>';
 for(var k in EX)if(EX[k][9].indexOf(v.m)>=0)h+=exCard(k);
 return h;
}
function vExs(){
 var h='<h1>مكتبة التمارين</h1><div class="chips">'+Object.keys(G).map(function(k){return '<button class="chip'+(gf===k?' on':'')+'" onclick="gf=\''+k+'\';render()">'+G[k]+'</button>'}).join('')+'</div>';
 for(var k in EX)if(gf==='all'||EX[k][1]===gf)h+=exCard(k);
 return h;
}
function vEx(){
 var k=v.e,e=EX[k],h='<button class="back" onclick="backE()">← رجوع</button><h1>'+e[0]+'</h1><p style="margin-bottom:10px">'+e[9].map(function(m){return '<span class="tag" style="margin-inline-end:6px">'+MN[m]+'</span>'}).join('')+'</p>'+pic(k,true)+'<h2>إزاي تعمله</h2><div class="card"><ol>'+e[5].map(function(s){return '<li>'+s+'</li>'}).join('')+'</ol></div><div class="card"><b style="color:var(--yl)">نصيحة:</b> '+e[8]+'</div>';
 if(e[6]||e[7])h+='<h2>التدرج</h2>';
 if(e[6])h+='<div class="card tap row" onclick="v.e=\''+e[6]+'\';render()"><div class="th">'+pic(e[6])+'</div><div>أسهل: <b>'+EX[e[6]][0]+'</b></div></div>';
 if(e[7])h+='<div class="card tap row" onclick="v.e=\''+e[7]+'\';render()"><div class="th">'+pic(e[7])+'</div><div>أصعب: <b>'+EX[e[7]][0]+'</b></div></div>';
 return h;
}
function vStats(){
 var hs=H(),tot=0;hs.forEach(function(x){tot+=x.s});
 var wk=hs.filter(function(x){return Date.now()-new Date(x.d)<6048e5}).length;
 var h='<h1>تقدمي</h1><div class="stats"><div class="stat"><b>'+hs.length+'</b><span class="mut">تمرين</span></div><div class="stat"><b>'+tot+'</b><span class="mut">مجموعة</span></div><div class="stat"><b>'+wk+'</b><span class="mut">الأسبوع ده</span></div></div><h2>آخر التمارين</h2>';
 if(!hs.length)return h+'<div class="card mut">لسه ماسجلتش تمرين. ابدأ من «برامجي».</div>';
 hs.slice(-15).reverse().forEach(function(x){var d=new Date(x.d);h+='<div class="card row"><div class="grow"><b>'+x.n+'</b><p class="mut">'+d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})+'</p></div><span class="tag">'+x.s+' مجموعة</span></div>'});
 return h+'<button class="btn alt" onclick="if(confirm(\'مسح كل السجل؟\')){S([]);render()}">مسح السجل</button>';
}
render();
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
</script>
</body>
</html>
